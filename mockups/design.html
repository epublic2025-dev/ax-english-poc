<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 고르기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
/* ───────── 목업 작업대 (테마와 무관한 바깥 틀) ───────── */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: #ECEBE7; color: #23221F;
  font-family: 'IBM Plex Sans KR', system-ui, sans-serif;
  word-break: keep-all; letter-spacing: -0.01em;
}
button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #2F6FEB; outline-offset: 2px; }

.studio {
  max-width: 1120px; margin: 0 auto; padding: 20px 16px 48px;
  display: grid; gap: 20px;
  grid-template-columns: 1fr;
  grid-template-areas: "head" "pick" "phone" "fx" "sum";
}
@media (min-width: 900px) {
  .studio {
    grid-template-columns: minmax(0, 1fr) 410px;
    grid-template-areas: "head phone" "pick phone" "fx phone" "sum phone";
    align-items: start;
  }
  .stage { position: sticky; top: 16px; }
}
.studio-head { grid-area: head; }
.studio-head h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.02em; }
.studio-head p { margin: 0; font-size: 14px; line-height: 1.6; color: #5C5A54; max-width: 60ch; }
.pick { grid-area: pick; display: grid; gap: 16px; }
.fx { grid-area: fx; }
.sum { grid-area: sum; }
.stage { grid-area: phone; display: flex; justify-content: center; }

.group { background: #FFF; border: 1px solid #DEDCD5; border-radius: 12px; padding: 14px; }
.group h2 { margin: 0 0 10px; font-size: 15px; }
.group .hint { margin: -4px 0 10px; font-size: 13px; color: #6B6963; line-height: 1.5; }

.themes { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .themes { grid-template-columns: repeat(3, 1fr); } }
.theme-card {
  text-align: left; background: #FAFAF8; border: 2px solid #E2E0D9; border-radius: 10px;
  padding: 10px 12px; display: grid; gap: 6px;
}
.theme-card[aria-pressed="true"] { border-color: #2F6FEB; background: #F2F6FF; }
.theme-card b { font-size: 15px; }
.theme-card span { font-size: 12.5px; color: #6B6963; line-height: 1.45; }
.swatch { display: flex; gap: 4px; align-items: center; }
.swatch i { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
.swatch em { font-style: normal; margin-left: 6px; font-size: 16px; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1px solid #D6D4CC; background: #FAFAF8; border-radius: 999px;
  padding: 6px 12px; font-size: 13.5px;
}
.seg button[aria-pressed="true"] { background: #23221F; color: #FFF; border-color: #23221F; }
.fx-row { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #F0EEE8; }
.fx-row:first-of-type { border-top: 0; }
.fx-row > span { font-size: 13.5px; color: #3D3B36; }
.sum-text { margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
.copy { border: 1px solid #23221F; background: #23221F; color: #FFF; border-radius: 8px; padding: 8px 14px; font-size: 14px; }

/* ───────── 휴대폰 틀 ───────── */
.phone {
  position: relative; width: 390px; max-width: 100%; height: 800px;
  border: 10px solid #1A1A1A; border-radius: 44px; overflow: hidden;
  background: var(--paper); color: var(--ink); font-family: var(--body);
  box-shadow: 0 24px 60px rgba(30, 28, 24, .22);
  isolation: isolate;
}
@media (max-width: 560px) { .phone { width: 100%; height: 760px; border-width: 6px; border-radius: 30px; } }
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; height: 34px; z-index: 5;
  display: flex; justify-content: space-between; align-items: center; padding: 0 24px;
  font: 600 13px 'IBM Plex Sans KR', sans-serif; color: var(--ink); pointer-events: none;
}
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding: 44px 18px 24px; display: flex; flex-direction: column; gap: 14px;
}
.screen.has-tabs { padding-bottom: 96px; }

/* ───────── 테마 토큰 ───────── */
.phone[data-theme="garden"] {
  --bg: #DDE7D6; --paper: #F1F5EC; --sheet: #FBFCF8; --ink: #1E3328; --ink2: #56675B;
  --line: #D3DFCC; --accent: #2F6B47; --accent-ink: #234F35; --accent-bg: #E1EDE2;
  --good: #2A7A49; --good-bg: #E0F0E2; --bad: #B9502C; --bad-bg: #FBE6DC; --pen: #C4532F;
  --sun: #F2A65A; --petal: #E86F5C;
  --r: 22px; --r-btn: 16px;
  --display: 'Gowun Dodum', sans-serif; --body: 'IBM Plex Sans KR', sans-serif; --word: 'Gowun Dodum', sans-serif;
}
.phone[data-theme="sticker"] {
  --bg: #DCD3FF; --paper: #F4F1FF; --sheet: #FFFFFF; --ink: #2A1E5C; --ink2: #6B6290;
  --line: #D9D1F7; --accent: #6C4CE0; --accent-ink: #4B2FB8; --accent-bg: #ECE6FF;
  --good: #11935F; --good-bg: #D9F6E9; --bad: #E0402A; --bad-bg: #FFE2DC; --pen: #E0402A; --sun: #FFC531;
  --r: 20px; --r-btn: 16px;
  --display: 'Jua', sans-serif; --body: 'IBM Plex Sans KR', sans-serif; --word: 'Jua', sans-serif;
}
.phone[data-theme="deck"] {
  --bg: #D9DEE6; --paper: #EEF1F5; --sheet: #FFFFFF; --ink: #1F2430; --ink2: #5F6676;
  --line: #DDE2EA; --accent: #3446D9; --accent-ink: #2433A8; --accent-bg: #E8EBFC;
  --good: #1B8C5E; --good-bg: #E3F5EC; --bad: #C9420C; --bad-bg: #FCEBE3; --pen: #C9420C;
  --r: 16px; --r-btn: 12px;
  --display: 'IBM Plex Sans KR', sans-serif; --body: 'IBM Plex Sans KR', sans-serif; --word: 'Fraunces', serif;
}

/* 정원: 위는 아침 하늘빛, 아래로 갈수록 풀빛 */
.phone[data-theme="garden"] .screen {
  background: linear-gradient(180deg, #F6F8EF 0%, var(--paper) 45%, #E8F0E1 100%);
}

/* ───────── 공통 부품 ───────── */
.small { margin: 0; font-size: 13px; color: var(--ink2); line-height: 1.5; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; position: relative; }
.sheet h2 { margin: 0 0 4px; font: 700 17px/1.35 var(--display); }
.sheet p { margin: 0 0 12px; font-size: 14px; color: var(--ink2); line-height: 1.55; }
.btn {
  display: block; width: 100%; border: 0; border-radius: var(--r-btn); padding: 13px 16px;
  font: 600 16px var(--body); background: var(--accent-bg); color: var(--accent-ink);
}
.btn.primary { background: var(--accent); color: #FFF; }
.btn:disabled { opacity: .4; cursor: default; }

.phone[data-theme="garden"] .sheet { border: 0; box-shadow: 0 2px 0 var(--line), 0 6px 18px rgba(47, 107, 71, .06); }
.phone[data-theme="garden"] .sheet h2 { font-weight: 400; font-size: 19px; }
.phone[data-theme="garden"] .btn { font: 400 18px var(--display); }
.phone[data-theme="garden"] .btn.primary { background: var(--accent); box-shadow: 0 3px 0 var(--accent-ink); }
.phone[data-theme="sticker"] .sheet { border-width: 2px; box-shadow: 0 4px 0 var(--line); }
.phone[data-theme="sticker"] .btn { font-family: var(--display); font-weight: 400; font-size: 18px; box-shadow: 0 4px 0 var(--line); transition: transform .06s, box-shadow .06s; }
.phone[data-theme="sticker"] .btn.primary { box-shadow: 0 4px 0 var(--accent-ink); }
.phone[data-theme="sticker"] .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-ink); }
.phone[data-theme="deck"] .sheet { border: 0; box-shadow: 0 1px 2px rgba(31, 36, 48, .07), 0 0 0 1px var(--line); }

/* 홈 */
.home-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 8px; }
.home-top h1 { margin: 2px 0 0; font: 700 25px/1.25 var(--display); letter-spacing: -0.02em; }
.phone[data-theme="sticker"] .home-top h1 { font-weight: 400; font-size: 28px; }
.streak { display: flex; align-items: baseline; gap: 2px; padding: 6px 12px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--line); }
.streak .flame { font-size: 18px; align-self: center; }
.streak b { font: 700 20px var(--display); }
.streak small { font-size: 12px; color: var(--ink2); }
.goal-row { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 8px; }
.goal-row b { font-weight: 600; }
.bar { height: 10px; border-radius: 999px; background: var(--accent-bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.phone[data-theme="garden"] .bar { height: 12px; background: #E4ECDD; }
.phone[data-theme="garden"] .bar i { background: linear-gradient(90deg, #7DB36B, var(--accent)); }
.garden-rows { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.garden-rows div { display: grid; gap: 2px; padding: 8px 2px; border-radius: 14px; background: var(--paper); }
.garden-rows .plant { font-size: 26px; line-height: 1.1; }
.garden-rows b { font: 400 18px var(--display); }
.garden-rows span { font-size: 11.5px; color: var(--ink2); }
.phone[data-theme="sticker"] .bar { height: 14px; border: 2px solid var(--line); background: #FFF; }
.phone[data-theme="sticker"] .bar i { background: var(--sun); }
.next-topic { margin: 0 0 2px !important; font: 700 21px var(--display) !important; color: var(--ink) !important; }
.path { display: flex; align-items: center; gap: 0; padding: 6px 4px 0; }
.node { display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--ink2); flex: 0 0 auto; width: 52px; }
.node i {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
  background: var(--sheet); border: 2px solid var(--line); font: 600 15px var(--body); color: var(--ink2);
}
.node.now i { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-bg); }
.node.done i { background: var(--accent); border-color: var(--accent); color: #FFF; }
.phone[data-theme="garden"] .home-top h1, .phone[data-theme="garden"] .next-topic { font-weight: 400 !important; }
.phone[data-theme="garden"] .streak b { font-weight: 400; }
.link { flex: 1; height: 2px; background: var(--line); margin-bottom: 20px; }
.tabs {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px 18px;
  background: var(--sheet); border-top: 1px solid var(--line);
}
.tabs button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; color: var(--ink2); padding: 4px 0; position: relative; }
.tabs button.on { color: var(--accent); font-weight: 600; }
.tabs svg { width: 24px; height: 24px; }
.tabs .dot { position: absolute; top: 0; right: calc(50% - 22px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #FFF; font-size: 11px; display: grid; place-items: center; padding: 0 5px; }
.phone[data-theme="sticker"] .tabs { border-top: 2px solid var(--line); }
.phone[data-theme="sticker"] .tabs button { font-family: var(--display); font-size: 13px; }

/* 문제 풀기 */
.qtop { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
.qtop .x { width: 34px; height: 34px; border: 0; background: none; font-size: 20px; color: var(--ink2); }
.qtop .bar { flex: 1; }
.combo {
  min-width: 0; font: 700 13px var(--body); color: var(--bad); white-space: nowrap;
  opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s;
}
.combo.show { opacity: 1; transform: scale(1); }
.combo.bump { animation: bump .35s ease; }
.qhint { margin: 6px 0 0; font: 600 15px var(--body); color: var(--ink2); }
.qcard {
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r);
  padding: 26px 16px 22px; display: grid; justify-items: center; gap: 6px; position: relative;
}
.qcard .word { font: 700 40px/1.1 var(--word); letter-spacing: -0.01em; color: var(--ink); text-align: center; }
.qcard .pos { font-size: 13px; color: var(--ink2); }
.qcard p { margin: 0; font: 500 19px/1.5 var(--body); text-align: center; }
.speak {
  position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--paper); font-size: 18px; display: grid; place-items: center;
}
.speak.inline { position: static; width: 32px; height: 32px; font-size: 15px; flex: 0 0 auto; }
.phone[data-theme="garden"] .qcard { border: 0; box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(47, 107, 71, .08); }
.phone[data-theme="garden"] .qcard .word { font-weight: 400; font-size: 44px; color: var(--accent-ink); }
.phone[data-theme="garden"] .opt { border: 0; box-shadow: 0 2px 0 var(--line); font: 400 19px var(--display); }
.phone[data-theme="garden"] .opt.is-good { box-shadow: 0 2px 0 var(--good); }
.phone[data-theme="garden"] .opt.is-bad { box-shadow: 0 2px 0 var(--bad); }
.phone[data-theme="garden"] .opt .key { border-radius: 50%; border: 0; background: var(--paper); }
.phone[data-theme="garden"] .face { border: 0; box-shadow: 0 2px 0 var(--line), 0 10px 24px rgba(47, 107, 71, .08); }
.phone[data-theme="garden"] .face .word, .phone[data-theme="garden"] .face .mean,
.phone[data-theme="garden"] .res-title, .phone[data-theme="garden"] .stat b, .phone[data-theme="garden"] .fb-title { font-weight: 400; }
.phone[data-theme="garden"] .tile { border: 0; box-shadow: 0 2px 0 var(--line); }
.phone[data-theme="garden"] .stat { border: 0; box-shadow: 0 2px 0 var(--line); }
.phone[data-theme="garden"] .grade { border: 0; box-shadow: 0 2px 0 var(--line); }
.phone[data-theme="sticker"] .qcard { border-width: 2px; box-shadow: 0 5px 0 var(--line); }
.phone[data-theme="sticker"] .qcard .word { font-weight: 400; font-size: 46px; color: var(--accent-ink); }
.phone[data-theme="deck"] .qcard {
  border: 0; padding: 40px 16px 34px;
  box-shadow: 0 1px 2px rgba(31, 36, 48, .08), 0 0 0 1px var(--line),
    0 7px 0 -3px #F7F8FA, 0 7px 0 -2px var(--line), 0 14px 0 -7px #F2F4F7, 0 14px 0 -6px var(--line);
  margin-bottom: 10px;
}
.phone[data-theme="deck"] .qcard .word { font-weight: 500; font-size: 46px; }

.opts { display: grid; gap: 10px; }
.opt {
  position: relative; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-btn);
  padding: 14px 14px; font: 500 17px var(--body);
}
.opt .key { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; color: var(--ink2); border: 1px solid var(--line); flex: 0 0 auto; }
.opt.is-good { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opt.is-answer { border-color: var(--good); border-style: dashed; }
.phone[data-theme="sticker"] .opt { border-width: 2px; box-shadow: 0 4px 0 var(--line); font: 400 19px var(--display); transition: transform .06s, box-shadow .06s; }
.phone[data-theme="sticker"] .opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.phone[data-theme="sticker"] .opt.is-good { box-shadow: 0 4px 0 var(--good); }
.phone[data-theme="sticker"] .opt.is-bad { box-shadow: 0 4px 0 var(--bad); }
.phone[data-theme="sticker"] .opt .key { border-radius: 50%; }
.report { align-self: center; background: none; border: 0; font-size: 12.5px; color: var(--ink2); padding: 6px; margin-top: auto; }

/* 문장 조립 */
.line {
  min-height: 104px; padding: 8px 2px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px;
  border-bottom: 2px solid var(--line); position: relative;
  background-image: repeating-linear-gradient(180deg, transparent 0, transparent 50px, var(--line) 50px, var(--line) 51px);
}
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 6px 0; }
.tile {
  border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r-btn);
  padding: 9px 13px; font: 500 17px var(--word);
}
.tile.used { visibility: hidden; }
.line.is-good .tile { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.line.is-bad .tile { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.phone[data-theme="sticker"] .tile { border-width: 2px; box-shadow: 0 3px 0 var(--line); font-size: 19px; }
.phone[data-theme="deck"] .tile { font-family: var(--body); }

/* 카드 복습 */
.deck-left { margin: 0; text-align: center; font-size: 13px; color: var(--ink2); }
.flip { perspective: 1200px; height: 330px; cursor: pointer; }
.flip-in { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.flip.away .flip-in { transform: rotateY(180deg) translateX(-120%) rotate(8deg); opacity: 0; transition: transform .35s ease-in, opacity .35s; }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r);
  display: grid; place-content: center; justify-items: center; gap: 10px; padding: 20px; text-align: center;
}
.face.back { transform: rotateY(180deg); }
.face .word { font: 700 44px/1.1 var(--word); }
.face .mean { font: 700 30px var(--display); }
.face .en { margin: 0; font: 500 17px/1.5 var(--word); }
.face .ko { margin: 0; font-size: 14px; color: var(--ink2); }
.face .tap { margin: 0; font-size: 13px; color: var(--ink2); }
.phone[data-theme="sticker"] .face { border-width: 2px; box-shadow: 0 5px 0 var(--line); }
.phone[data-theme="sticker"] .face .word, .phone[data-theme="sticker"] .face .mean { font-weight: 400; }
.phone[data-theme="deck"] .face { border: 0; box-shadow: 0 1px 2px rgba(31, 36, 48, .08), 0 0 0 1px var(--line); }
.phone[data-theme="deck"] .face .word { font-weight: 500; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades[hidden] { display: none; }
.grade { border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r-btn); padding: 10px 4px; display: grid; gap: 2px; font: 600 15px var(--body); }
.grade small { font-weight: 400; font-size: 12px; color: var(--ink2); }
.grade.g0 { color: var(--bad); } .grade.g2 { color: var(--accent); } .grade.g3 { color: var(--good); }
.phone[data-theme="sticker"] .grade { border-width: 2px; box-shadow: 0 3px 0 var(--line); font-family: var(--display); font-weight: 400; font-size: 16px; }

/* 결과 안내 (아래에서 올라옴) */
.fb {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 18px 18px 24px;
  background: var(--sheet); border-top: 3px solid var(--good);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  display: grid; gap: 8px;
}
.fb.open { transform: translateY(0); }
.fb.good { background: var(--good-bg); border-color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); }
.fb-title { margin: 0; font: 700 20px var(--display); }
.fb.good .fb-title { color: var(--good); } .fb.bad .fb-title { color: var(--bad); }
.fb-ex { margin: 0; display: flex; gap: 8px; align-items: center; font: 500 16px/1.45 var(--word); }
.fb-ko { margin: 0; font-size: 14px; color: var(--ink2); }
.fb .btn { margin-top: 4px; }
.fb.good .btn { background: var(--good); color: #FFF; }
.fb.bad .btn { background: var(--bad); color: #FFF; }
.phone[data-theme="sticker"] .fb-title { font-weight: 400; font-size: 24px; }
.phone[data-theme="sticker"] .fb.good .btn { box-shadow: 0 4px 0 #0B6B45; }
.phone[data-theme="sticker"] .fb.bad .btn { box-shadow: 0 4px 0 #A82D1C; }

/* ───────── 효과 ───────── */
.stamp-ring { position: absolute; inset: -7px -9px; pointer-events: none; overflow: visible; width: calc(100% + 18px); height: calc(100% + 14px); }
.stamp-ring path { stroke: var(--pen); stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .38s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }

function countUp(el, to, prefix) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.textContent = prefix + to; return; }
  const start = performance.now(); const dur = 800;
  const step = (now) => {
    const k = Math.min(1, (now - start) / dur);
    el.textContent = prefix + Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function confetti(petals) {

  for (let i = 0; i < (petals ? 36 : 70); i++) {
    const p = document.createElement('i');
    if (petals) p.className = 'petal';
    p.style.left = `${Math.random() * 100}%`;
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = `${1.6 + Math.random() * 1.4}s`;
    p.style.animationDelay = `${Math.random() * 0.4}s`;
    p.style.setProperty('--dx', `${(Math.random() - 0.5) * 160}px`);
    p.style.setProperty('--rot', `${Math.random() * 720 - 360}deg`);
    box.appendChild(p);

  setTimeout(() => { box.innerHTML = ''; }, 3400);
}

  packRow.insertAdjacentHTML('afterend', `<div class="fx-row"><span>들어 보기<br><small style="color:#8A877F">고른 종류로</small></span><div class="seg" id="listen">
    <button data-l="good">정답</button><button data-l="combo">연속 정답 1→5</button><button data-l="bad">오답</button><button data-l="badvoice">오답 + 정답 발음</button><button data-l="flip">카드 뒤집기</button><button data-l="swipe">카드 넘기기</button><button data-l="done">레슨 통과</button></div></div>`);
  fx.querySelectorAll('#listen button').forEach((b) => b.addEventListener('click', () => {
    const l = b.dataset.l;
    if (l === 'combo') { [1, 2, 3, 4, 5].forEach((s, i) => setTimeout(() => play('good', s, true), i * 420)); }
    else if (l === 'badvoice') { play('bad', 1, true); setTimeout(() => say(C().word.id, 'w'), 520); }
    else play(l, 1, true);
  }));
  $('#sumText').textContent = summary();
}
function summary() {
  const t = THEMES.find((x) => x.id === S.theme).name;
  const lab = (key) => { const f = FX.find((x) => x.key === key); return f.opts.find(([v]) => v === S.fx[key])[1]; };
  return `템플릿 ${t} / 정답 ${lab('correct')} / 오답 ${lab('wrong')} / 효과음 ${lab('sound')}(${lab('pack')}) / 정답 발음 ${lab('voice')} / 진동 ${lab('vibrate')} / XP 날아가기 ${lab('xp')} / 연속 정답 ${lab('combo')} / 레슨 통과 ${lab('finish')}`;
}
$('#copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(summary()); $('#copy').textContent = '복사했어요'; }
  catch (e) { $('#copy').textContent = '복사 안 됨 — 위 글을 직접 알려 주세요'; }
  setTimeout(() => { $('#copy').textContent = '조합 복사하기'; }, 1800);
});

const _render = render;
render = function () { delete phone.dataset.answered; _render(); };
render();
</script>
</body>
